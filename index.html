<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tembea Savannah Stays - Browse available stays and filter by location, price or type.">
<title>Tembea Savannah Stays | Browse Stays</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">Tembea <span>Savannah</span> Stays</a>
            <nav>
                <ul>
                    <li><a href="index.html" class="active">Stays</a></li>
                    <li><a href="add-stay.html">Add Stay</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Available Stays</h1>
        <p class="page-subtitle">Browse and filter stays listed by companies. Each card shows its own average rating.</p>

            <section class="filters">
                <div class="filter-group">
                    <label for="filter-location">Location:</label>
                    <input type="text" id="filter-location" placeholder="e.g. Nairobi">
                </div>

                <div class="filter-group">
                    <label for="filter-price">Max Price ($)</label>
                    <input type="number" id="filter-price" placeholder="e.g. 100" min="0" step="1">
                </div>

                <div class="filter-group">
                    <label for="filter-type">Type</label>
                    <select id="filter-type">
                        <option value="">All types</option>
                        <option value="Hotel">Hotel</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Villa">Villa</option>
                        <option value="Hostel">Hostel</option>
                        <option value="Guesthouse">Guesthouse</option>
                    </select>
                </div>

                     <button type="button" id="clear-filters" class="btn-secondary">Clear</button>
            </section>

            <section id="stays-grid" class="stays-grid">
                 <!-- inject Cards here by script.js -->
            </section>
    </main>

     <footer>
    <p>&copy; 2026 Tembea Savannah Stays. Built with HTML, CSS & JavaScript.</p>
  </footer>
   
  <script src="script.js"></script>
</body>
</html>
