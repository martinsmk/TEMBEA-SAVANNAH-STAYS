<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tembea Savannah Stays - Add a new stay listing for your company.">
    <title>Tembea Savannah Stays | Add a Stay</title>
      <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">Tembea <span>Savannah</span> Stays</a>
            <nav>
                <ul>
                    <li><a href="index.html">Stays</a></li>
                    <li><a href="add-stay.html" class="active">Add Stay</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main>
            <h1 class="page-title">Add a New Stay</h1>
            <p class="page-subtitle">Fill in the details below to add a new stay listing for your company.</p>


             <div id="success-message" class="success-message" hidden>         <!-- Hidden by default. JavaScript adds the class "show" after a successful save. -->
                Stay added successfully! You can view it on the <a href="index.html">Stays page</a>.
             </div>


            <section class="form-container">
                <form id="add-stay-form" novalidate>   <!-- novalidate turns off the browser's built-in validation so we can use our own JS validation -->

                    <div class="form-group">
                        <label for="stay-name">Stay Name *</label>
                        <input type="text" id="stay-name" name="name" placeholder="e.g. Oceanview Apartment" required>
                   
                        <div id="name-error" class="error-message"></div>        <!-- Error message container – JavaScript writes the error text here -->
                    </div>

                    <div class="form-group">
                        <label for="stay-location">Location *</label>
                        <input type="text" id="stay-location" name="location" placeholder="e.g. Nairobi" required>
                        <div id="location-error" class="error-message"></div>    <!-- Error message container – JavaScript writes the error text here -->
                    </div>

                    <div class="form-group">
                        <label for="stay-type">Stay Type *</label>
                        <select id="stay-type" name="type" required>
                            <option value="">Select a type</option>
                            <option value="Hotel">Hotel</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Villa">Villa</option>
                            <option value="Hostel">Hostel</option>
                            <option value="Guesthouse">Guesthouse</option>
                        </select>
                        <div id="type-error" class="error-message"></div>    <!-- Error message container – JavaScript writes the error text here -->
                    </div>

                    <button type="submit" class="btn btn-primary">Add Stay</button>
                </form> 
             </section>
        </main>
            
            <footer>
                <p>&copy; 2026 Tembea Savannah Stays. Built with HTML, CSS & JavaScript.</p>
            </footer>

            <script src="script.js"></script>
    </body>
</html>
